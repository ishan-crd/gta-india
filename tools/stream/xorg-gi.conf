# Headless X screen on the RTX 3090 for streaming GTA India.
# Never drives the physical monitor, never switches VTs, and ignores all host input devices
# (input arrives via XTEST from the streaming server only).
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "AllowEmptyInput" "true"
    Option "DontVTSwitch" "true"
    Option "DontZap" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "Device"
    Identifier "GPU"
    Driver "nvidia"
    BusID "PCI:13:0:0"
    Option "AllowEmptyInitialConfiguration" "true"
    Option "UseDisplayDevice" "none"
    Option "ProbeAllGpus" "false"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "GPU"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 1920 1080
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "Layout"
    Screen "Screen0"
EndSection
